name: Build Android APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.jar is not present in this project (see README),
      # so we provision Gradle itself instead of relying on ./gradlew.
      # This action puts a working `gradle` command on PATH.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project/notesapp
        run: gradle assembleDebug --stacktrace

      # Path must not contain "/./" — actions/upload-artifact@v4 rejects it.
      # Do not combine a "./"-prefixed path with working-directory; use one
      # full, clean relative path from the repo root instead.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/notesapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
