name: Build Android APK from ZIP

on:
  push:
    paths:
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find the uploaded ZIP
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t zips < <(
            find . -type f -name "*.zip" -not -path "./.git/*" | sort
          )

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No ZIP file found."
            exit 1
          fi

          if [ "${#zips[@]}" -gt 1 ]; then
            echo "Multiple ZIP files found:"
            printf '  %s\n' "${zips[@]}"
            echo "Please keep only one Android project ZIP."
            exit 1
          fi

          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Using: ${zips[0]}"

      # 3. Extract the ZIP
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          unzip -q "${{ steps.zip.outputs.zip }}" -d project

      # 4. Find the actual Android/Gradle project root
      - name: Locate Android project
        id: root
        shell: bash
        run: |
          set -euo pipefail

          root="$(
            find project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit
          )"

          if [ -z "$root" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts."
            echo "Make sure the ZIP contains the Android project."
            exit 1
          fi

          root="$(dirname "$root")"

          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Android project root: $root"

      # 5. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 6. Read the Gradle version from the project
      - name: Read Gradle version
        id: gradle
        working-directory: ${{ steps.root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          version=""

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            url="$(
              grep "^distributionUrl=" gradle/wrapper/gradle-wrapper.properties \
              | sed "s/^distributionUrl=//"
            )"

            version="$(
              printf "%s" "$url" \
              | sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p'
            )
          fi

          if [ -z "$version" ]; then
            echo "Gradle version could not be detected."
            echo "Using Gradle 8.13."
            version="8.13"
          fi

          echo "Gradle version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 7. Install Gradle
      # This avoids needing gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      # 8. Build the APK
      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon assembleDebug

      # 9. Find the generated APK
      - name: Find APK
        id: apk
        working-directory: ${{ steps.root.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          apk="$(
            find . -type f \
              -path "*/build/outputs/apk/*.apk" \
              -print -quit
          )"

          if [ -z "$apk" ]; then
            echo "APK was not produced."
            exit 1
          fi

          echo "APK found: $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # 10. Make APK available for download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.root.outputs.root }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
