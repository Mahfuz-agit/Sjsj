name: Build Android APK from ZIP

on:
  push:
    paths:
      - "**.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          zip_file=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$zip_file" ]; then
            echo "No ZIP file found in the repository."
            exit 1
          fi

          echo "Found ZIP: $zip_file"
          echo "zip_file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

          echo "ZIP extracted successfully."

      - name: Find Android project root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          settings_file=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$settings_file" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts."
            echo "The ZIP does not appear to contain a Gradle Android project."
            exit 1
          fi

          project_root=$(dirname "$settings_file")

          echo "Android project root: $project_root"
          echo "project_root=$project_root" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect Gradle version
        id: gradle
        working-directory: ${{ steps.root.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          version=""

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            distribution_url=$(grep "^distributionUrl=" \
              "gradle/wrapper/gradle-wrapper.properties" \
              | cut -d "=" -f 2- || true)

            if [ -n "$distribution_url" ]; then
              version=$(echo "$distribution_url" \
                | sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p')
            fi
          fi

          if [ -z "$version" ]; then
            version="8.13"
            echo "Could not detect Gradle version."
            echo "Using Gradle $version."
          else
            echo "Detected Gradle $version."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon assembleDebug

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.root.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          apk_file=$(find . -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$apk_file" ]; then
            echo "Build finished but no APK was found."
            exit 1
          fi

          echo "APK found: $apk_file"
          echo "apk_file=$apk_file" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.root.outputs.project_root }}/${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 14
